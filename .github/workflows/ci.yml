name: CI

on:
  push:
  pull_request:

jobs:
  # Fast feedback: pure unit tests (no database, no HTTP stack)
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, openssl, sodium, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite Unit --display-deprecations

  # Full suite (unit + database + http + security + console) across PHP versions
  tests:
    name: PHP ${{ matrix.php }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, openssl, sodium, fileinfo, pcntl
          coverage: none
      - name: Install redis-server (integration tests start their own throw-away instance)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && sudo systemctl disable --now redis-server || true
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict --no-check-lock
      - run: vendor/bin/phpunit --display-deprecations
      - name: Smoke-test the CLI
        run: |
          cp .env.example .env
          php naluz key:generate --jwt
          touch storage/database.sqlite
          php naluz migrate
          php naluz route:list
          php naluz route:cache && php naluz route:clear
          php naluz db:seed --force && php naluz view:clear
